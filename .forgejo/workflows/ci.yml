# Dummy commnentÈ

name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Build & test
        run: mvn -B -ntp verify

  # =====================================================================
  # TCK officiels Jakarta — exécutés en parallèle pour réduire le wall-time.
  #
  # Le module champollion-tck est volontairement HORS reactor (POM Model 4.0.0
  # standalone, contrainte ShrinkWrap héritée de cassini-tck/foy-tck). Les jobs
  # ci-dessous l'invoquent directement par chemin après un install local du
  # reactor.
  #
  # État M6 : champollion-tck pas encore créé. La garde `if` ci-dessous rend
  # ces jobs no-op tant que les scripts run-official-tck-*.sh ne sont pas
  # commités. Le job `deploy` reste correctement gated dessus dès leur arrivée.
  # =====================================================================
  tck-jsonp:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Install reactor (skip tests)
        run: mvn -B -ntp install -DskipTests

      - name: Cache Jakarta TCK artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/jakarta/json/jakarta.json-tck-common
            ~/.m2/repository/jakarta/json/jakarta.json-tck-tests
            ~/.m2/repository/jakarta/json/jakarta.json-tck-tests-pluggability
          key: tck-jsonp-2.1.0-v1

      - name: Install Jakarta JSON-P 2.1 TCK (Eclipse Foundation)
        run: ./install-tck.sh jsonp

      - name: Jakarta JSON-P 2.1 TCK
        run: |
          if [ -x ./run-official-tck-jsonp-2.1.sh ]; then
            ./run-official-tck-jsonp-2.1.sh all
          else
            echo "::notice::run-official-tck-jsonp-2.1.sh not yet present — skipped (M6 deliverable)."
          fi

      - name: Upload TCK JSON-P report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: tck-jsonp-report
          path: champollion-tck/target/tck-report*.txt
          if-no-files-found: ignore

  tck-jsonb:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Install reactor (skip tests)
        run: mvn -B -ntp install -DskipTests

      - name: Cache Jakarta TCK artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/jakarta/json/bind/jakarta.json.bind-tck
          key: tck-jsonb-3.0.0-v1

      - name: Install Jakarta JSON-B 3.0 TCK (Eclipse Foundation)
        run: ./install-tck.sh jsonb

      - name: Jakarta JSON-B 3.0 TCK — runtime mode
        run: |
          if [ -x ./run-official-tck-jsonb-3.0.sh ]; then
            ./run-official-tck-jsonb-3.0.sh all
          else
            echo "::notice::run-official-tck-jsonb-3.0.sh not yet present — skipped (M6 deliverable)."
          fi

      - name: Jakarta JSON-B 3.0 TCK — static codegen mode
        run: |
          # Le mode statique recompile les fixtures TCK avec champollion-codegen-apt
          # et rejoue la suite. Permet de valider que le codegen produit le même
          # comportement observable que le runtime introspectif.
          if [ -x ./run-official-tck-jsonb-3.0.sh ]; then
            ./run-official-tck-jsonb-3.0.sh all --static
          else
            echo "::notice::static codegen mode not yet present — skipped (M5 + M6 deliverable)."
          fi

      - name: Upload TCK JSON-B report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: tck-jsonb-report
          path: champollion-tck/target/tck-report*.txt
          if-no-files-found: ignore

  # =====================================================================
  # Google Protobuf conformance — runner C++ buildé via CMake une fois,
  # caché ensuite via actions/cache (key sur version protobuf upstream).
  # Le gate `grep` à la fin transforme le rapport en exit non-zéro si la
  # suite ne dit pas `CONFORMANCE SUITE PASSED`. Toute régression future
  # bloquera la PR auto.
  # =====================================================================
  tck-protobuf:
    runs-on: ubuntu-latest
    needs: build
    # Version protobuf upstream pinned. À bumper ici ET dans la key actions/cache
    # ci-dessous quand le step `Detect upstream protobuf staleness` émet un warning.
    env:
      PROTOBUF_VERSION: v35.0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Detect upstream protobuf staleness
        # Best-effort : si l'API GitHub est down ou rate-limited, on log puis
        # continue sans bloquer le CI (la conformance reste fonctionnelle).
        continue-on-error: true
        run: |
          set -e
          LATEST=$(curl -fsSL --max-time 10 \
              https://api.github.com/repos/protocolbuffers/protobuf/releases/latest \
              | grep -oE '"tag_name": *"[^"]+"' \
              | head -1 \
              | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$LATEST" ]; then
              echo "::notice::Impossible de récupérer la dernière version protobuf (API rate-limit ou network). Skip check."
              exit 0
          fi
          echo "Latest upstream protobuf : $LATEST"
          echo "Pinned dans champollion : $PROTOBUF_VERSION"
          if [ "$LATEST" != "$PROTOBUF_VERSION" ]; then
              cat >&2 <<EOF
          ::warning title=conformance_test_runner stale::
          Une nouvelle version protobuf upstream est disponible.
            Pinned (champollion CI) : $PROTOBUF_VERSION
            Latest (upstream)        : $LATEST
          Pour bumper :
            1. Édite .forgejo/workflows/ci.yml — PROTOBUF_VERSION en haut du job tck-protobuf.
            2. Met à jour la key actions/cache (conformance-test-runner-protobuf-$LATEST).
            3. Re-pousse — le premier run va re-builder le runner (~5 min puis cache).
            4. Si des tests deviennent unexpected failures, ajuste
               champollion-protobuf-tck/conformance-failure-list.txt ou fixe le code.
          EOF
          else
              echo "::notice::pinned version === latest, OK"
          fi

      - name: Cache conformance_test_runner Google
        id: cache-conformance-runner
        uses: actions/cache@v4
        with:
          path: /opt/conformance_test_runner
          # ⚠ Cette clé doit être maintenue manuellement en phase avec PROTOBUF_VERSION
          # ci-dessus. Le step `Detect upstream protobuf staleness` warn si un
          # bump upstream a eu lieu.
          key: conformance-test-runner-protobuf-v35.0

      - name: Install build tools for conformance_test_runner
        if: steps.cache-conformance-runner.outputs.cache-hit != 'true'
        # Le runner Forgejo (act_runner image minimaliste Debian/Ubuntu) n'a
        # pas cmake/g++ par défaut. On les installe seulement si le cache
        # actions/cache est froid (build initial ou bump PROTOBUF_VERSION).
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
              cmake g++ make git ca-certificates

      - name: Build conformance_test_runner (CMake)
        if: steps.cache-conformance-runner.outputs.cache-hit != 'true'
        run: |
          # Shallow clone tag PROTOBUF_VERSION — pas besoin de l'historique.
          git clone --depth=1 --branch="$PROTOBUF_VERSION" \
              https://github.com/protocolbuffers/protobuf.git /tmp/protobuf-src
          cd /tmp/protobuf-src && mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -Dprotobuf_BUILD_CONFORMANCE=ON \
                   -Dprotobuf_BUILD_TESTS=OFF
          cmake --build . -j"$(nproc)" --target conformance_test_runner
          cp conformance_test_runner /opt/conformance_test_runner

      - name: Install reactor (skip tests)
        run: mvn -B -ntp install -DskipTests

      - name: Run conformance smoke
        run: |
          export CONFORMANCE_TEST_RUNNER=/opt/conformance_test_runner
          ./run-official-conformance-protobuf.sh smoke

      - name: Gate — CONFORMANCE SUITE PASSED
        run: |
          # Exit non-zéro si la suite ne dit pas explicitement PASSED.
          # Bloque toute régression future (87 expected failures listés
          # dans champollion-protobuf-tck/conformance-failure-list.txt).
          grep -q "CONFORMANCE SUITE PASSED" \
            champollion-protobuf-tck/target/conformance-report.txt
          grep -q "0 unexpected failures" \
            champollion-protobuf-tck/target/conformance-report.txt

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: conformance-protobuf-report
          path: champollion-protobuf-tck/target/conformance-report.txt
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    needs: [tck-jsonp, tck-jsonb, tck-protobuf]

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Configure Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>vidocq-snapshots</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
              <server>
                <id>vidocq-releases</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy to Forgejo Maven registry
        run: mvn -B -ntp deploy -DskipTests
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "❌ Secret Forgejo manquant : SLACK_WEBHOOK_URL" >&2
            exit 1
          fi
          payload=$(node <<'JS'
          process.stdout.write(JSON.stringify({
            text: `[ViBot]: ❌ *Build CI échoué* — \`${process.env.REPO}\`@${process.env.REF}\n<${process.env.RUN_URL}|Voir le run>`
          }))
          JS
          )
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload"


      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          set -euo pipefail
          # Silencieux si secret absent — un build success ne doit pas fail à cause du notify.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "ℹ️ Secret SLACK_WEBHOOK_URL absent — notif success skipped"
            exit 0
          fi
          VERSION=$(mvn -q -DforceStdout -N -Dexpression=project.version help:evaluate 2>/dev/null || echo "?")
          export VERSION
          export SHORT_SHA="${SHA:0:7}"
          payload=$(node <<'JS'
          const msg = process.env.COMMIT_MSG || '';
          const subject = msg.split('\n')[0];
          const author = process.env.COMMIT_AUTHOR ? ` par *${process.env.COMMIT_AUTHOR}*` : '';
          process.stdout.write(JSON.stringify({
            text: `[ViBot]: ✅ *Build CI réussi* — \`${process.env.REPO}\`@${process.env.REF} (v${process.env.VERSION})\n> \`${process.env.SHORT_SHA}\`${author} — _${subject}_\n<${process.env.RUN_URL}|Voir le run>`
          }))
          JS
          )
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload"
