# Dummy commnentÈ

name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Build & test
        run: mvn -B -ntp verify

  # =====================================================================
  # TCK officiels Jakarta — exécutés en parallèle pour réduire le wall-time.
  #
  # Le module champollion-tck est volontairement HORS reactor (POM Model 4.0.0
  # standalone, contrainte ShrinkWrap héritée de cassini-tck/foy-tck). Les jobs
  # ci-dessous l'invoquent directement par chemin après un install local du
  # reactor.
  #
  # État M6 : champollion-tck pas encore créé. La garde `if` ci-dessous rend
  # ces jobs no-op tant que les scripts run-official-tck-*.sh ne sont pas
  # commités. Le job `deploy` reste correctement gated dessus dès leur arrivée.
  # =====================================================================
  tck-jsonp:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Install reactor (skip tests)
        run: mvn -B -ntp install -DskipTests

      - name: Cache Jakarta TCK artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/jakarta/json/jakarta.json-tck-common
            ~/.m2/repository/jakarta/json/jakarta.json-tck-tests
            ~/.m2/repository/jakarta/json/jakarta.json-tck-tests-pluggability
          key: tck-jsonp-2.1.0-v1

      - name: Install Jakarta JSON-P 2.1 TCK (Eclipse Foundation)
        run: ./install-tck.sh jsonp

      - name: Jakarta JSON-P 2.1 TCK
        run: |
          if [ -x ./run-official-tck-jsonp-2.1.sh ]; then
            ./run-official-tck-jsonp-2.1.sh all
          else
            echo "::notice::run-official-tck-jsonp-2.1.sh not yet present — skipped (M6 deliverable)."
          fi

      - name: Upload TCK JSON-P report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tck-jsonp-report
          path: champollion-tck/target/tck-report*.txt
          if-no-files-found: ignore

  tck-jsonb:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Install reactor (skip tests)
        run: mvn -B -ntp install -DskipTests

      - name: Cache Jakarta TCK artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/jakarta/json/bind/jakarta.json.bind-tck
          key: tck-jsonb-3.0.0-v1

      - name: Install Jakarta JSON-B 3.0 TCK (Eclipse Foundation)
        run: ./install-tck.sh jsonb

      - name: Jakarta JSON-B 3.0 TCK — runtime mode
        run: |
          if [ -x ./run-official-tck-jsonb-3.0.sh ]; then
            ./run-official-tck-jsonb-3.0.sh all
          else
            echo "::notice::run-official-tck-jsonb-3.0.sh not yet present — skipped (M6 deliverable)."
          fi

      - name: Jakarta JSON-B 3.0 TCK — static codegen mode
        run: |
          # Le mode statique recompile les fixtures TCK avec champollion-codegen-apt
          # et rejoue la suite. Permet de valider que le codegen produit le même
          # comportement observable que le runtime introspectif.
          if [ -x ./run-official-tck-jsonb-3.0.sh ]; then
            ./run-official-tck-jsonb-3.0.sh all --static
          else
            echo "::notice::static codegen mode not yet present — skipped (M5 + M6 deliverable)."
          fi

      - name: Upload TCK JSON-B report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tck-jsonb-report
          path: champollion-tck/target/tck-report*.txt
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    needs: [tck-jsonp, tck-jsonb]

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Configure Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>vidocq-snapshots</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
              <server>
                <id>vidocq-releases</id>
                <username>vidocq-ci-deploy</username>
                <password>${{ secrets.MAVEN_DEPLOY_TOKEN }}</password>
                <configuration>
                  <httpConfiguration>
                    <all>
                      <usePreemptive>true</usePreemptive>
                    </all>
                  </httpConfiguration>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy to Forgejo Maven registry
        run: mvn -B -ntp deploy -DskipTests
