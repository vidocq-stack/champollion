// Subset minimal de google/protobuf/test_messages_proto3.proto pour le
// conformance_test_runner Google. Couvre les scalaires + repeated scalaires
// + une string + bytes. Sans nested message, oneof, map ni enum pour M5.1.
//
// Spec : https://github.com/protocolbuffers/protobuf/blob/main/src/google/protobuf/test_messages_proto3.proto
//
// Le proto fullname reste 'protobuf_test_messages.proto3.TestAllTypesProto3'
// (attendu par le runner Google) ; le Java package est forcé via le plugin
// Maven (cf. POM) à io.vidocq.champollion.protobuf.tck.proto3.

syntax = "proto3";

package protobuf_test_messages.proto3;

message TestAllTypesProto3 {
  int32 optional_int32 = 1;
  int64 optional_int64 = 2;
  uint32 optional_uint32 = 3;
  uint64 optional_uint64 = 4;
  sint32 optional_sint32 = 5;
  sint64 optional_sint64 = 6;
  fixed32 optional_fixed32 = 7;
  fixed64 optional_fixed64 = 8;
  sfixed32 optional_sfixed32 = 9;
  sfixed64 optional_sfixed64 = 10;
  float optional_float = 11;
  double optional_double = 12;
  bool optional_bool = 13;
  string optional_string = 14;
  bytes optional_bytes = 15;

  repeated int32 repeated_int32 = 31;
  repeated int64 repeated_int64 = 32;
  repeated string repeated_string = 33;
  repeated bytes repeated_bytes = 34;
}
